name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/api-gateway/requirements.txt
          python -m pip install -r services/fraud-service/requirements.txt
          python -m pip install -r services/notification-service/requirements.txt
          python -m pip install pytest pytest-asyncio aiosqlite

      - name: Compile sources
        run: python -m compileall services tests migrations

      - name: Run tests
        run: python -m pytest tests -q
