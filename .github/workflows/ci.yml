name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: banking_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d banking_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://admin:admin@127.0.0.1:5432/banking_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            services/api-gateway/requirements.txt
            services/auth-service/requirements.txt
            services/fraud-service/requirements.txt
            services/notification-service/requirements.txt
            services/scoring-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/api-gateway/requirements.txt
          python -m pip install -r services/auth-service/requirements.txt
          python -m pip install -r services/fraud-service/requirements.txt
          python -m pip install -r services/notification-service/requirements.txt
          python -m pip install -r services/assistant-service/requirements.txt
          python -m pip install -r services/scoring-service/requirements.txt
          python -m pip install pytest pytest-asyncio aiosqlite

      - name: Compile sources
        run: python -m compileall services tests migrations ml

      - name: Validate migration graph
        run: python -m alembic heads

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: Verify migrated schema
        run: python -m pytest tests/test_migration_schema.py -q

      - name: Run tests
        run: python -m pytest tests -q

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - fraud-service
          - notification-service
          - assistant-service
          - scoring-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image
        run: docker build services/${{ matrix.service }}
